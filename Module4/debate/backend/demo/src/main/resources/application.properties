spring.application.name=demo

# ======================================================
# = SERVER CONFIGURATION
# ======================================================
server.port=8080


# ======================================================
# = FRONTEND CORS CONFIGURATION
# ======================================================
# Allow requests from your frontend (React + Vite)
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true


# ======================================================
# = DATABASE CONFIGURATION (for later use)
# ======================================================
# Uncomment when you integrate MySQL
# spring.datasource.url=jdbc:mysql://localhost:3306/argumate_db
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true

# For now, exclude JPA since not using DB
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration


# ======================================================
# = GEMINI API CONFIGURATION
# ======================================================
# Your Google Cloud Project ID ? update this with your actual project ID
gemini.project.id=

# Gemini API key ? if using REST API version
gemini.api.key=

# API endpoint (you can use gemini-pro or gemini-1.5-flash)
#gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent
gemini.api.url=https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent


# If using Vertex AI SDK (instead of REST API), also add:
gemini.location=us-central1


# ======================================================
# = LOGGING CONFIGURATION
# ======================================================
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.example.demo=DEBUG


# ======================================================
# = CLERK CONFIGURATION (for later authentication)
# ======================================================
clerk.api.key=YOUR_CLERK_BACKEND_API_KEY
clerk.frontend.key=YOUR_CLERK_PUBLISHABLE_KEY
clerk.issuer=https://YOUR-CLERK-INSTANCE.clerk.accounts.dev
